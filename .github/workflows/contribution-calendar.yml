name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          user: Mayank8092

          template: classic

          base: activity

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          filename: github-metrics.svg
